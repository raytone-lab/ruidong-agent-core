[project]
name = "rd-llm-gateway"
version = "1.0.0"
description = "LLM provider adapters with stream chunk normalizer"
requires-python = ">=3.12"
dependencies = [
    "rd-agent-contracts",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_llm_gateway"]
