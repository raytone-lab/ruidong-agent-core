[project]
name = "rd-agent-proto"
version = "0.1.0"
description = "Agent Runtime protobuf files, generated Python bindings, and contract converters"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.29",
    "rd-agent-contracts>=1.14.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.73",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_agent_proto", "src/ruidong"]

[tool.hatch.build.targets.wheel.force-include]
"../../proto" = "rd_agent_proto/proto"
