[project]
name = "rd-agent-contracts"
version = "1.0.0"
description = "Agent Runtime PaaS shared contracts (types, ports, event envelope)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_agent_contracts"]
