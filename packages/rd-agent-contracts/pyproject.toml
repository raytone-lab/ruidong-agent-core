[project]
name = "rd-agent-contracts"
version = "1.1.0"
description = "Agent Runtime PaaS shared contracts (types, ports, event envelope)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_agent_contracts"]
