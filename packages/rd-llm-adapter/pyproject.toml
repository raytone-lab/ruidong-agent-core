[project]
name = "rd-llm-adapter"
version = "1.0.0"
description = "LLM provider adapter layer (low-level: protocols + adapters + parser sessions)"
requires-python = ">=3.12"
dependencies = [
    "rd-agent-contracts>=1.1.0,<2.0.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd_llm_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
