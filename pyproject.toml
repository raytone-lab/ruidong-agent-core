[project]
name = "ruidong-agent-core-workspace"
version = "0.0.0"
description = "Agent Runtime PaaS monorepo workspace root (not published)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
rd-agent-contracts = { workspace = true }
rd-llm-gateway = { workspace = true }
rd-replay-evals = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
