name: CI

on:
  push:
    branches: [main, "feature/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
      - name: Buf lint
        run: buf lint
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps (含 dev tools)
        run: uv sync --group dev
      - name: Release gate
        run: uv run python tools/scripts/release_gate.py
